<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <title>中创元穹本体智能平台架构图</title>
  <desc>1920x1080纯SVG拓扑式架构图，无外部图片、无网络资源、无外部依赖。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7fbff"/>
      <stop offset="100%" stop-color="#edf4fb"/>
    </linearGradient>
    <linearGradient id="platform" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#173d68"/>
      <stop offset="100%" stop-color="#0b2747"/>
    </linearGradient>
    <linearGradient id="kernel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f6f9f"/>
      <stop offset="100%" stop-color="#0a4d73"/>
    </linearGradient>
    <linearGradient id="domain" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ecf6ff"/>
      <stop offset="100%" stop-color="#d9ecfb"/>
    </linearGradient>
    <linearGradient id="agent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff4e7"/>
      <stop offset="100%" stop-color="#ffe2bf"/>
    </linearGradient>
    <linearGradient id="app" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eef9f2"/>
      <stop offset="100%" stop-color="#d8f0df"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.12"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-opacity="0.08"/>
    </filter>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#42779d"/>
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#d8892b"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b8b61"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1920" height="1080" fill="url(#bg)"/>
  <rect x="54" y="48" width="1812" height="984" rx="28" fill="none" stroke="#c8d9e9" stroke-width="2"/>

  <!-- Header -->
  <text x="92" y="104" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#123a62">中创元穹本体智能平台</text>
  <text x="92" y="145" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="18" fill="#5b7084">驱动数据语义化与业务智能洞察 · 业务—技术解耦 · 本体语义层 · Agent 原生运行</text>

  <!-- Top capability ribbon -->
  <g>
    <rect x="1218" y="78" width="566" height="82" rx="18" fill="#ffffff" stroke="#cbdceb" stroke-width="2"/>
    <text x="1248" y="112" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#2a577d">平台核心特性</text>
    <text x="1248" y="141" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="15" fill="#5e7488">零门槛建模 · 强语义理解 · 声明式推理 · 多 Agent 协作 · 可治理</text>
  </g>

  <!-- Left: data/system ecosystem -->
  <g>
    <rect x="92" y="220" width="360" height="626" rx="24" fill="#ffffff" stroke="#a9bfd3" stroke-width="2"/>
    <rect x="92" y="220" width="360" height="62" rx="24" fill="#e8f1f9"/>
    <rect x="92" y="258" width="360" height="24" fill="#e8f1f9"/>
    <text x="122" y="260" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#17476f">企业数据与业务系统</text>

    <rect x="116" y="309" width="312" height="88" rx="16" fill="#f7fbff" stroke="#c5d9ea"/>
    <text x="140" y="342" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#245a82">结构化数据</text>
    <text x="140" y="372" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="14" fill="#62798d">业务库 · 数据仓库 · 主数据 · 指标</text>

    <rect x="116" y="414" width="312" height="88" rx="16" fill="#f7fbff" stroke="#c5d9ea"/>
    <text x="140" y="447" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#245a82">实时 / 非结构化</text>
    <text x="140" y="477" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="14" fill="#62798d">门架 / 日志 / ES · 文件 · 流式事件</text>

    <rect x="116" y="519" width="312" height="88" rx="16" fill="#f7fbff" stroke="#c5d9ea"/>
    <text x="140" y="552" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#245a82">业务应用</text>
    <text x="140" y="582" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="14" fill="#62798d">收费 · 清分结算 · 融资租赁 · 运营管理</text>

    <rect x="116" y="624" width="312" height="88" rx="16" fill="#f7fbff" stroke="#c5d9ea"/>
    <text x="140" y="657" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#245a82">外部能力</text>
    <text x="140" y="687" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="14" fill="#62798d">API · 第三方系统 · GIS · 对外接口</text>

    <text x="122" y="772" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="14" fill="#7b8e9e">核心思想</text>
    <text x="122" y="798" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#294e6e">把“数据”转换为可理解、可计算、可治理的业务对象。</text>
  </g>

  <!-- Center platform container -->
  <g>
    <rect x="500" y="196" width="920" height="682" rx="30" fill="url(#platform)"/>
    <rect x="525" y="221" width="870" height="632" rx="24" fill="#f9fcff" opacity="0.98"/>
    <text x="565" y="269" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#123a62">OntoPlatform · 本体智能平台</text>
    <text x="565" y="297" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="15" fill="#62798d">面向用户提供统一的本体建模、运行、智能与业务应用能力</text>

    <!-- Ontology layer -->
    <rect x="560" y="327" width="830" height="136" rx="20" fill="url(#domain)" stroke="#84b6db" stroke-width="2"/>
    <text x="588" y="360" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#0c547f">01 · 本体语义层</text>
    <rect x="588" y="381" width="176" height="54" rx="12" fill="#ffffff" stroke="#b6d5eb"/>
    <text x="676" y="414" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#2a5d84">对象 Object</text>
    <rect x="779" y="381" width="176" height="54" rx="12" fill="#ffffff" stroke="#b6d5eb"/>
    <text x="867" y="414" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#2a5d84">关系 Relation</text>
    <rect x="970" y="381" width="176" height="54" rx="12" fill="#ffffff" stroke="#b6d5eb"/>
    <text x="1058" y="414" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#2a5d84">属性 Property</text>
    <rect x="1161" y="381" width="201" height="54" rx="12" fill="#ffffff" stroke="#b6d5eb"/>
    <text x="1261" y="414" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#2a5d84">业务规则 / 指标</text>

    <!-- Kernel -->
    <rect x="560" y="486" width="830" height="162" rx="20" fill="#eaf7fb" stroke="#6caec4" stroke-width="2"/>
    <text x="588" y="520" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#17617d">02 · Onto Runtime Kernel</text>
    <text x="588" y="546" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="14" fill="#62798d">最小可复用运行时：不绑定任何业务领域</text>

    <rect x="588" y="568" width="150" height="54" rx="12" fill="url(#kernel)"/>
    <text x="663" y="601" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff">Object Graph</text>
    <rect x="752" y="568" width="150" height="54" rx="12" fill="url(#kernel)"/>
    <text x="827" y="601" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff">ChangeSet</text>
    <rect x="916" y="568" width="150" height="54" rx="12" fill="url(#kernel)"/>
    <text x="991" y="601" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff">Action Compiler</text>
    <rect x="1080" y="568" width="132" height="54" rx="12" fill="url(#kernel)"/>
    <text x="1146" y="601" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff">Validator</text>
    <rect x="1226" y="568" width="136" height="54" rx="12" fill="url(#kernel)"/>
    <text x="1294" y="601" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff">Repository</text>

    <!-- Intelligence -->
    <rect x="560" y="671" width="830" height="146" rx="20" fill="url(#agent)" stroke="#e1ad70" stroke-width="2"/>
    <text x="588" y="705" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#985b1d">03 · AI / Agent 智能层</text>
    <text x="588" y="731" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="14" fill="#7b6c5b">把自然语言意图转换为可执行的本体查询、动作、工作流与智能决策</text>
    <rect x="588" y="752" width="162" height="48" rx="12" fill="#fffaf4" stroke="#e9c18c"/>
    <text x="669" y="781" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#955d25">NL → DSL / Query</text>
    <rect x="765" y="752" width="148" height="48" rx="12" fill="#fffaf4" stroke="#e9c18c"/>
    <text x="839" y="781" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#955d25">Agent ToolChain</text>
    <rect x="928" y="752" width="148" height="48" rx="12" fill="#fffaf4" stroke="#e9c18c"/>
    <text x="1002" y="781" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#955d25">Workflow / Rule</text>
    <rect x="1091" y="752" width="133" height="48" rx="12" fill="#fffaf4" stroke="#e9c18c"/>
    <text x="1157" y="781" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#955d25">Projection</text>
    <rect x="1239" y="752" width="123" height="48" rx="12" fill="#fffaf4" stroke="#e9c18c"/>
    <text x="1300" y="781" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#955d25">Policy / Guard</text>
  </g>

  <!-- Right side: applications -->
  <g>
    <rect x="1464" y="220" width="324" height="626" rx="24" fill="#ffffff" stroke="#b7ccb9" stroke-width="2"/>
    <rect x="1464" y="220" width="324" height="62" rx="24" fill="#e8f5eb"/>
    <rect x="1464" y="258" width="324" height="24" fill="#e8f5eb"/>
    <text x="1494" y="260" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#24613a">业务智能应用</text>

    <rect x="1488" y="309" width="276" height="88" rx="16" fill="url(#app)" stroke="#a9d0b4"/>
    <text x="1512" y="342" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#28623e">业务工作台</text>
    <text x="1512" y="372" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="14" fill="#637b6a">对象浏览 · 场景配置 · 运营分析</text>

    <rect x="1488" y="414" width="276" height="88" rx="16" fill="url(#app)" stroke="#a9d0b4"/>
    <text x="1512" y="447" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#28623e">老板作战指挥舱</text>
    <text x="1512" y="477" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="14" fill="#637b6a">项目态势 · 经营指标 · 风险预警</text>

    <rect x="1488" y="519" width="276" height="88" rx="16" fill="url(#app)" stroke="#a9d0b4"/>
    <text x="1512" y="552" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#28623e">GIS / 数字孪生</text>
    <text x="1512" y="582" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="14" fill="#637b6a">空间关系 · 路网态势 · 动态投影</text>

    <rect x="1488" y="624" width="276" height="88" rx="16" fill="url(#app)" stroke="#a9d0b4"/>
    <text x="1512" y="657" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#28623e">智能 Agent 应用</text>
    <text x="1512" y="687" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="14" fill="#637b6a">问数 · 诊断 · 预测 · 决策辅助</text>

    <text x="1494" y="772" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="14" fill="#6c8172">统一入口</text>
    <text x="1494" y="798" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#2c5f42">同一套本体，在不同业务场景复用。</text>
  </g>

  <!-- Connectors: data -> ontology -->
  <path d="M452 350 C478 350, 478 350, 560 350" fill="none" stroke="#5d84a4" stroke-width="4" marker-end="url(#arrowBlue)"/>
  <path d="M452 456 C480 456, 482 408, 560 408" fill="none" stroke="#5d84a4" stroke-width="4" marker-end="url(#arrowBlue)"/>
  <path d="M452 562 C488 562, 488 444, 560 444" fill="none" stroke="#5d84a4" stroke-width="4" marker-end="url(#arrowBlue)"/>
  <path d="M452 668 C494 668, 496 480, 560 480" fill="none" stroke="#5d84a4" stroke-width="4" marker-end="url(#arrowBlue)"/>

  <!-- Connectors: platform -> apps -->
  <path d="M1390 362 C1420 362, 1422 350, 1464 350" fill="none" stroke="#4f8b63" stroke-width="4" marker-end="url(#arrowGreen)"/>
  <path d="M1390 505 C1422 505, 1420 456, 1464 456" fill="none" stroke="#4f8b63" stroke-width="4" marker-end="url(#arrowGreen)"/>
  <path d="M1390 595 C1420 595, 1420 562, 1464 562" fill="none" stroke="#4f8b63" stroke-width="4" marker-end="url(#arrowGreen)"/>
  <path d="M1390 727 C1426 727, 1426 668, 1464 668" fill="none" stroke="#4f8b63" stroke-width="4" marker-end="url(#arrowGreen)"/>

  <!-- AI feedback loop -->
  <path d="M1332 671 C1382 650, 1418 620, 1460 620" fill="none" stroke="#d8892b" stroke-width="3" stroke-dasharray="9 8" marker-end="url(#arrowOrange)"/>
  <path d="M1460 755 C1408 808, 1358 830, 1308 816" fill="none" stroke="#d8892b" stroke-width="3" stroke-dasharray="9 8" marker-end="url(#arrowOrange)"/>
  <text x="1418" y="645" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="13" fill="#a66a28">反馈 / 观测 / 调整</text>

  <!-- Bottom domain lane -->
  <g>
    <rect x="92" y="900" width="1696" height="90" rx="20" fill="#ffffff" stroke="#cad9e4" stroke-width="2"/>
    <text x="122" y="936" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#315a79">领域 Provider / 可复用领域包</text>
    <text x="122" y="964" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="14" fill="#667c8f">高速联网收费</text>
    <rect x="254" y="946" width="10" height="10" rx="5" fill="#5d9ac3"/>
    <text x="286" y="964" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="14" fill="#667c8f">融资租赁</text>
    <rect x="376" y="946" width="10" height="10" rx="5" fill="#5d9ac3"/>
    <text x="408" y="964" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="14" fill="#667c8f">企业日常运营</text>
    <rect x="548" y="946" width="10" height="10" rx="5" fill="#5d9ac3"/>
    <text x="580" y="964" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="14" fill="#667c8f">行业扩展领域</text>

    <line x1="746" y1="925" x2="746" y2="970" stroke="#d0dce6" stroke-width="2"/>
    <text x="780" y="936" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#315a79">领域只负责声明：</text>
    <text x="780" y="964" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="14" fill="#667c8f">model.yaml · business · actions · app workbench</text>
  </g>

  <!-- Key relationship labels -->
  <g>
    <rect x="452" y="322" width="94" height="26" rx="13" fill="#eff6fb" stroke="#bfd5e5"/>
    <text x="499" y="340" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="12" fill="#4c718f">数据语义化</text>

    <rect x="1410" y="338" width="52" height="26" rx="13" fill="#eef8f0" stroke="#b8d7bf"/>
    <text x="1436" y="356" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="12" fill="#4f7f5e">复用</text>
  </g>

  <!-- Legend -->
  <g transform="translate(1600 1000)">
    <rect x="0" y="0" width="16" height="16" rx="4" fill="#173d68"/>
    <text x="24" y="14" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="12" fill="#5d7284">平台核心</text>
    <rect x="102" y="0" width="16" height="16" rx="4" fill="#7bb4da"/>
    <text x="126" y="14" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="12" fill="#5d7284">语义/数据</text>
    <rect x="216" y="0" width="16" height="16" rx="4" fill="#e0a45a"/>
    <text x="240" y="14" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="12" fill="#5d7284">AI/Agent</text>
    <rect x="316" y="0" width="16" height="16" rx="4" fill="#8bbf99"/>
    <text x="340" y="14" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="12" fill="#5d7284">业务应用</text>
  </g>

  <!-- Footer -->
  <text x="92" y="1016" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="13" fill="#8495a5">Architecture: Data → Ontology → Runtime Kernel → Agent Intelligence → Business Applications</text>
</svg>
